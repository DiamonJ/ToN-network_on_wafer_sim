// Standard TrafficPattern cross-validation of the wavelet gating layer
// 4x4 mesh, num_vcs=24 (aligned with the WSE paper)
sim_type = latency;

topology = mesh;
k = 4;
n = 2;
routing_function = dim_order;

router = iq;
num_vcs = 24;
vc_buf_size = 8;

// Wavelet (WSE) injection gating: 0 = free injection (baseline), 1 = gated
wse_gating = 0;
wse_phase_width = 64;
wse_strip_width = 2;
wse_vc_split = 1;

vc_allocator = islip;
sw_allocator = islip;
alloc_iters = 1;

traffic = uniform;
injection_rate = 0.1;
packet_size = 8;

sim_count = 1;
warmup_periods = 3;
sample_period = 1000;
max_samples = 50;
measure_stats = 1;
latency_thres = 10000.0;
stats_out = traffic_wse_stats.txt;
