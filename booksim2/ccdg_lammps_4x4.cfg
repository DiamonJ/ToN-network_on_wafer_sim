sim_type = ccdg;
ccdg_file = /work1/jiangtao/lammps_trace/runs/trace_4ranks_20260721_201258/trace_4ranks_global.ccdg;
cpu_frequency_ghz = 2.5;
noc_frequency_ghz = 2.0;
flit_size_bytes = 8;
// Compute capability of the target hardware (ops/s).
// compute time (sec) = compute_ops / capability; then x noc_freq -> cycles.
// 2.5e9 ops/s = 2.5 GHz x 1 op/cycle (trace machine's CPU);
// 0 = fall back to ccdg_compute_rate (ops/cycle), then freq_ratio (legacy).
ccdg_compute_capability = 2.5e9;
// Legacy per-cycle rate (ops/cycle); ignored when capability > 0
ccdg_compute_rate = 1.25;
// Injection queue depth (flits) for PE backpressure; 0 = auto = max single-packet length.
// When the queue cannot hold the next whole packet, the PE stalls (credit
// backpressure), so network congestion propagates into the CCDG schedule.
ccdg_inject_queue_depth = 0;
// Deterministic orchestration (EST schedule): node release-time table
// produced by ccdg_scheduler.py ("node_id est_cycles" per line);
// empty/none = responsive execution (baseline, MPI wait semantics).
// With a schedule the PE holds at each node until its EST (sched_wait).
ccdg_schedule_file = ;

topology = mesh;
k = 2;
n = 2;
routing_function = dim_order;

router = iq;
num_vcs = 24;
vc_buf_size = 8;

// Wavelet (WSE) injection gating: 0 = free injection (baseline), 1 = gated
wse_gating = 0;
wse_phase_width = 64;
wse_strip_width = 2;
wse_vc_split = 1;

vc_allocator = islip;
sw_allocator = islip;
alloc_iters = 1;

routing_delay = 1;
vc_alloc_delay = 1;
sw_alloc_delay = 1;

sim_count = 1;
seed = 0;
print_activity = 0;
print_csv_results = 1;
stats_out = lammps_4ranks_stats.txt;